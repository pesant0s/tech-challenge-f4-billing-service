# Desenvolvimento local, com hot-reload. Produção roda no EKS.
services:
  api:
    build: .
    container_name: billing-api
    ports:
      - "8003:8000"
    env_file: .env
    environment:
      PYTHONPATH: /app
      LOG_FORMAT: console
    volumes:
      - .:/app
      - /app/.venv
      - /app/__pycache__
    entrypoint: ["sh", "-c"]
    command:
      - |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload \
          --reload-exclude '**/.venv*/**' \
          --reload-exclude '**/__pycache__/**' \
          --reload-exclude '**/tests/**'
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-alpine
    container_name: billing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: oficina
      RABBITMQ_DEFAULT_PASS: oficina
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Replica set de um nó: transações multi-documento exigem replica set.
  # O healthcheck inicia o replica set na primeira vez e depois só confirma que há primário.
  # O nó se anuncia como localhost: a API conecta direto (directConnection) em vez de seguir o anúncio.
  mongo:
    image: mongo:8.0
    container_name: billing-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo_data:
