apiVersion: v1
kind: Service
metadata:
  name: billing-service
spec:
  # Porta fixa: o target group do NLB da plataforma aponta para a 30082.
  type: NodePort
  selector:
    app.kubernetes.io/name: billing-service
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30082
      protocol: TCP
