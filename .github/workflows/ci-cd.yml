name: CI/CD

# Testes, manifestos e boot da imagem sempre; infraestrutura, publicação e deploy só com AMBIENTE_ATIVO=true
# (ADR-013). A main só recebe código por Pull Request. Contrato: tech-challenge-f4-plataforma/docs/infraestrutura/contrato.md.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  PREFIXO_SSM: /tech-challenge-f4
  ECR_REPOSITORY: tech-challenge-f4-billing-service
  NAMESPACE: billing-service
  DEPLOYMENT: billing-service

permissions:
  contents: read

jobs:
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    env:
      MONGO_URL: "mongodb://localhost:27017/?replicaSet=rs0"
      SECRET_KEY: "chave-de-ci-com-mais-de-32-caracteres-para-teste"
    # RabbitMQ real para o teste da thread de mensageria (ADR-019).
    services:
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: oficina
          RABBITMQ_DEFAULT_PASS: oficina
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # Service containers não aceitam `command`, e as transações exigem replica set: o MongoDB sobe por docker run.
      - name: MongoDB em replica set
        run: |
          docker run -d --name mongo --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "1" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for _ in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Abaixo de 80% de cobertura o pipeline falha.
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  qualidade:
    name: Qualidade (SonarQube Cloud)
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cobertura
      # O quality gate do SonarQube Cloud reprova o pipeline (sonar.qualitygate.wait no sonar-project.properties).
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  manifestos:
    name: Validar manifestos Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar e validar contra o schema
        run: |
          kubectl kustomize k8s/overlays/producao > /tmp/manifestos.yaml
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /tmp
          /tmp/kubeconform -strict -summary /tmp/manifestos.yaml

  imagem:
    name: Build e prova da imagem
    needs: [testes, manifestos]
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: oficina
          RABBITMQ_DEFAULT_PASS: oficina
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t tech-challenge-f4-billing-service:ci .

      - name: MongoDB em replica set
        run: |
          docker run -d --name mongo --publish 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "1" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for _ in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done

      - name: Provar que a imagem sobe contra MongoDB e RabbitMQ
        run: |
          docker run -d --name api --network host \
            -e MONGO_URL="mongodb://localhost:27017/?replicaSet=rs0" \
            -e SECRET_KEY=chave-de-ci-com-mais-de-32-caracteres-para-teste \
            -e RABBITMQ_URL=amqp://oficina:oficina@localhost:5672/%2F \
            -e LOG_FORMAT=json \
            tech-challenge-f4-billing-service:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ready && docker logs api 2>&1 | grep -q mensageria_conectada; then
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' api)" = "true" ] || break
            sleep 1
          done
          docker logs api
          exit 1

  ambiente-desligado:
    name: Publicação e deploy não executados
    needs: [testes, qualidade, manifestos, imagem]
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && vars.AMBIENTE_ATIVO != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "### Publicação e deploy pulados — AMBIENTE_ATIVO não está true, o ambiente AWS está desligado." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy no EKS
    needs: [testes, qualidade, manifestos, imagem]
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && vars.AMBIENTE_ATIVO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TEM_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      # Conta comum: OIDC. Laboratório (AWS Academy): credenciais da sessão.
      - name: Autenticar na AWS via OIDC
        if: env.TEM_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticar na AWS com as credenciais da sessão
        if: env.TEM_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Criar o ECR
        run: |
          CONTA=$(aws sts get-caller-identity --query Account --output text)
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=tech-challenge-f4-tfstate-${CONTA}" -backend-config="region=${AWS_REGION}"
          terraform -chdir=infra apply -auto-approve -input=false

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Construir e publicar a imagem
        id: publicar
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGEM="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          docker build -t "$IMAGEM" .
          docker push "$IMAGEM"
          echo "imagem=$IMAGEM" >> "$GITHUB_OUTPUT"

      - name: Apontar o kubectl para o cluster
        run: |
          CLUSTER=$(aws ssm get-parameter --name "$PREFIXO_SSM/cluster/nome" --query Parameter.Value --output text)
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

      - name: Criar o namespace
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # O Secret nunca é versionado: é montado a cada deploy.
      - name: Sincronizar Secret
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_EXTERNAL_POS_ID: ${{ secrets.MP_EXTERNAL_POS_ID }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        run: |
          ssm() { aws ssm get-parameter --name "$PREFIXO_SSM/$1" --with-decryption --query Parameter.Value --output text; }
          SECRET_KEY=$(ssm segredos/jwt_secret_key)
          RABBITMQ_URL=$(ssm rabbitmq/url)
          NEW_RELIC_LICENSE_KEY=$(ssm newrelic/license_key)
          echo "::add-mask::$SECRET_KEY"
          echo "::add-mask::$RABBITMQ_URL"
          [ "$NEW_RELIC_LICENSE_KEY" = "desligado" ] || echo "::add-mask::$NEW_RELIC_LICENSE_KEY"

          ARGS=(
            --from-literal=MONGO_URL="mongodb://mongo.${NAMESPACE}.svc.cluster.local:27017/?directConnection=true"
            --from-literal=SECRET_KEY="$SECRET_KEY"
            --from-literal=RABBITMQ_URL="$RABBITMQ_URL"
          )
          # Sem licença o agente fica desligado: a chave só entra se o parâmetro tiver um valor real.
          if [ -n "$NEW_RELIC_LICENSE_KEY" ] && [ "$NEW_RELIC_LICENSE_KEY" != "desligado" ]; then
            ARGS+=(--from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY")
          fi
          for chave in MP_ACCESS_TOKEN MP_EXTERNAL_POS_ID MP_WEBHOOK_SECRET; do
            if [ -n "${!chave}" ]; then
              ARGS+=(--from-literal="$chave=${!chave}")
            fi
          done
          kubectl create secret generic billing-service-segredos --namespace "$NAMESPACE" "${ARGS[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifestos
        env:
          IMAGEM: ${{ steps.publicar.outputs.imagem }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          # Com credencial do Mercado Pago o serviço cobra de verdade; sem ela, usa o simulador.
          if [ -n "$MP_ACCESS_TOKEN" ]; then
            sed -i 's/PAGAMENTO_PROVEDOR: "simulado"/PAGAMENTO_PROVEDOR: "mercadopago"/' k8s/base/configmap.yaml
          fi
          (cd k8s/overlays/producao && kustomize edit set image "IMAGEM_PLACEHOLDER=$IMAGEM")
          kubectl apply -k k8s/overlays/producao
          # Secret e ConfigMap entram por variável de ambiente: só um novo pod os enxerga.
          kubectl rollout restart "deployment/$DEPLOYMENT" -n "$NAMESPACE"
          kubectl rollout status statefulset/mongo -n "$NAMESPACE" --timeout=300s
          kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=300s

      - name: Teste de fumaça pelo API Gateway
        run: |
          ENDPOINT=$(aws ssm get-parameter --name "$PREFIXO_SSM/apigateway/endpoint" --query Parameter.Value --output text)
          # O health check do NLB leva alguns ciclos para marcar os pods como saudáveis.
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors -o /dev/null -w "HTTP %{http_code}\n" "$ENDPOINT/billing/openapi.json"

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get all -n "$NAMESPACE" || true
          kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/name=billing-service --tail=100 || true
          kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/name=mongo --tail=50 || true
